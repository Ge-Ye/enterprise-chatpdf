services:
  backend:
    build:
      context: ./chatpdf-backend
    env_file:
      - ./chatpdf-backend/.env
    environment:
      APP_HOST: 0.0.0.0
      DEBUG: "false"
      UPLOAD_DIR: /app/app/data/uploads
      CHROMA_DB_DIR: /app/app/data/chroma
    ports:
      - "8000:8000"
    volumes:
      - ./chatpdf-backend/app/data/chroma:/app/app/data/chroma
      - ./chatpdf-backend/app/data/uploads:/app/app/data/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8000/openapi.json"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./chatpdf-frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    environment:
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
